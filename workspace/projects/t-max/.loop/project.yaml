kind: ProjectGroup
id: t-max
name: T-MAX
root: ../../.local/t-max/mounts
defaultBranch: master
skill: SKILL.md
discoverySkills:
  frontend-delivery: .loop/skills/frontend-delivery.SKILL.md
  ane-standard-page: .loop/skills/ane-standard-page.SKILL.md
localPaths: .loop/local.paths.yaml
background:
  id: xiaoneng
  name: xiaoneng
  localPathKey: xiaoneng
  mount: ../../.local/t-max/mounts/background/xiaoneng
  integration:
    kind: skill-context
    version: 2.0.0
    contractVersion: 1.0.0
    manifest: harness/runtime/manifest.yaml
    contract: harness/contracts/runtime/skill-context.schema.json
    evidenceBundles:
      - ane-page-rules
      - standard-page-contract
      - import-rules
      - api-binding-rules
      - reference-pages
    validators:
      - page-contract
      - page-structure
      - import-rule
    executionModes:
      frontend-delivery: FullWorkflow
repositories:
  - id: KPIUI
    name: KPIUI
    localPathKey: KPIUI
    mount: ../../.local/t-max/mounts/repos/KPIUI
    remote: http://10.10.103.4/T-MAX/max-kpi-ui
  - id: max-console-ui
    name: max-console-ui
    localPathKey: max-console-ui
    mount: ../../.local/t-max/mounts/repos/max-console-ui
    remote: http://10.10.103.4/T-MAX/max-console
  - id: max-operate-monitor-ui
    name: max-operate-monitor-ui
    localPathKey: max-operate-monitor-ui
    mount: ../../.local/t-max/mounts/repos/max-operate-monitor-ui
    remote: http://10.10.103.4/T-MAX/max-operate-monitor-ui
  - id: operateBusiness
    name: operateBusiness
    localPathKey: operateBusiness
    mount: ../../.local/t-max/mounts/repos/operateBusiness
    remote: http://10.10.103.4/T-MAX/max-operate-business-ui
  - id: operateSupport
    name: operateSupport
    localPathKey: operateSupport
    mount: ../../.local/t-max/mounts/repos/operateSupport
    remote: http://10.10.103.4/T-MAX/max-operate-support-ui
  - id: dcm
    name: dcm
    localPathKey: dcm
    mount: ../../.local/t-max/mounts/repos/dcm
    remote: http://10.10.103.4/T-MAX/max-dcm-ui
  - id: scan
    name: scan
    localPathKey: scan
    mount: ../../.local/t-max/mounts/repos/scan
