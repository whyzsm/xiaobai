kind: Loop
version: 1
metadata:
  id: morning-triage
  name: Morning Triage Loop
  owner: wusheng
schedule:
  type: cron
  expression: "0 8 * * *"
  timezone: Asia/Shanghai
discovery:
  skill: triage
  sources:
    - type: ci
      connector: github-actions
    - type: issues
      connector: github
    - type: commits
      connector: github
    - type: memory
      path: memory/loops/morning-triage/state.md
orchestrator:
  agent: xiaobai.orchestrator.agent.yaml
handoff:
  strategy: one-worktree-per-finding
  project: app-a
  targetResolution:
    required: true
  worktreeRoot: worktrees/runs
  branchTemplate: "loop/morning-triage/{date}/{taskId}"
generator:
  agent: generator.agent.yaml
  harness: coding.harness.yaml
verification:
  evaluator: evaluator.agent.yaml
  requiredChecks:
    - lint
    - unit-tests
    - project-skill-review
  allowSelfReview: false
persistence:
  memory:
    stateFile: memory/loops/morning-triage/state.md
    inboxFile: memory/loops/morning-triage/inbox.md
    runLog: memory/loops/morning-triage/runs.jsonl
  outputs:
    - type: pull-request
      connector: github
    - type: ticket-update
      connector: jira
    - type: report
      path: reports/daily
budget:
  maxTokensPerRun: 200000
  maxRunsPerDay: 3
  maxRetriesPerTask: 2
  maxParallelTasks: 5
humanGate:
  requiredBefore:
    - merge
  reviewers:
    - owner
  gates:
    - id: merge-approval
      requiredBefore: merge
      reviewers:
        - owner
      subjectFields:
        - changedFiles
        - testResult
        - codeReviewResult
        - pullRequestPlan
      requiredEvidenceTypes:
        - test
        - review
        - human-approval
      maxAgeMinutes: 1440
workflow:
  stages:
    - id: triage-discovery
      kind: intake
      gate: automatic
      agent: generator.agent.yaml
      harness: coding.harness.yaml
      requiredChecks:
        - project-skill-review
      outputs:
        - findings
    - id: finding-isolation
      kind: planning
      gate: automatic
      agent: generator.agent.yaml
      harness: coding.harness.yaml
      dependsOn:
        - triage-discovery
      outputs:
        - worktreePlan
    - id: finding-implementation
      kind: coding
      gate: automatic
      agent: generator.agent.yaml
      harness: coding.harness.yaml
      dependsOn:
        - finding-isolation
      outputs:
        - changedFiles
    - id: finding-verification
      kind: review
      gate: automatic
      evaluator: evaluator.agent.yaml
      harness: coding.harness.yaml
      dependsOn:
        - finding-implementation
      requiredChecks:
        - lint
        - unit-tests
        - project-skill-review
      outputs:
        - testResult
        - codeReviewResult
    - id: pr-readiness
      kind: pr-readiness
      gate: automatic
      evaluator: evaluator.agent.yaml
      harness: coding.harness.yaml
      dependsOn:
        - finding-verification
      outputs:
        - pullRequestPlan
        - riskAndRollback
    - id: merge-approval
      kind: human-gate
      gate: manual
      dependsOn:
        - pr-readiness
      requiredBefore:
        - merge
      outputs:
        - humanMergeApproval
