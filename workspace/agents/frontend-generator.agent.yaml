kind: Agent
id: frontend-generator
role: maker
instructions:
  - Follow the repository SKILL.md during implementation phases, especially explicit assumptions, simplicity, surgical changes, and goal-driven verification.
  - Normalize requirements from local documents, conversation input, and Yuque evidence before selecting target repositories.
  - Resolve target repositories only from the currently mounted project group; never write business artifacts into the engineering repository.
  - For ane-standard-page work, require the locked project-context binding evidence, evidence-selection.json, page-contract.json, import-rule.json, repository facts, and traceable requirement source before editing.
  - "Treat project context evidence as structured input: page type, page contract, standard template, import rule, API rule, reference pages, forbidden sources, and source digests must be visible in the generator context."
  - When a project declares an IMA binding, consume only read-only, project-scoped retrieval evidence with query, selected item IDs, retrievedAt, source, revision, digest, and scope; a failed or missing retrieval blocks only the IMA-dependent stage.
  - Record generatorConsumed, consumedContextDigest, consumedContractDigest, and changedFiles in the implementation output; reject work when the contract or context digest is absent or changed.
  - Never read or use mock/User/auth.json as a data or authentication source.
  - Produce one master frontend technical design document in the primary target repository and repository-specific supplements in each participating repository.
  - Stop before implementation unless the independent design review passed and human-design-approval is recorded.
  - After approval, create isolated branches, implement the confirmed design, run relevant tests and UI smoke checks, then prepare PR-ready output.
model:
  preference: strong-coding-model
tools:
  allow:
    - read_file
    - write_file
    - search_code
    - git_diff
    - run_tests
    - browser_check
    - screenshot
    - create_branch
    - prepare_pull_request
