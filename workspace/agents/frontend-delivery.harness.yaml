kind: Harness
version: 1
metadata:
  id: frontend-delivery-harness
tools:
  allow:
    - read_file
    - write_file
    - search_code
    - git_diff
    - run_tests
    - browser_check
    - screenshot
    - create_branch
    - prepare_pull_request
  deny:
    - direct_merge
    - release
    - write_unmounted_repository
    - write_business_artifacts_to_engineering_repo
    - delete_repository
    - modify_budget_policy
context:
  loaders:
    - repository-skill
    - project-skill
    - requirement-brief
    - dynamic-mounted-repositories
    - frontend-master-design
    - repository-design-supplements
    - previous-memory
    - project-context
    - context-evidence-selection
    - project-page-contract
    - project-import-rule
  maxCharacters: 24000
completion:
  type: staged-objective
  conditions:
    - requirement_source_traceable
    - target_repositories_resolved
    - master_design_written_to_primary_target_repository
    - repository_design_supplements_written_to_each_target_repository
    - frontend_design_review_passed
    - human_design_approval_recorded
    - code_changed_after_design_approval
    - project_context_resolved
    - project_context_locked
    - page_contract_generated
    - page_contract_schema_passed
    - page_contract_digest_locked
    - generator_consumed_context_evidence
    - import_rule_verified
    - page_structure_verified
    - evaluator_reused_same_contract
    - stage_timing_recorded
    - tests_attempted
    - ui_smoke_attempted
    - pr_ready_summary_written
failure:
  onRequirementIncomplete: persist-to-inbox
  onDesignReviewFailure: stop-before-implementation
  onHumanDesignApprovalMissing: stop-before-implementation
  onToolError: retry-once
  onTestFailure: return-to-loop
  onBudgetExceeded: stop-and-persist
  errorCodes:
    - PROJECT_CONTEXT_REQUIRED
    - PROJECT_CONTEXT_DIGEST_MISMATCH
    - PAGE_CONTRACT_REQUIRED
    - PAGE_CONTRACT_SCHEMA_FAILED
    - PAGE_CONTRACT_DIGEST_MISMATCH
    - PROJECT_CONTEXT_RULE_NOT_CONSUMED
    - IMPORT_RULE_SOURCE_INVALID
    - MOCK_AUTH_SOURCE_FORBIDDEN
    - PAGE_STRUCTURE_NOT_STANDARD
output:
  required:
    - requirementBrief
    - targetRepositories
    - masterDesignPath
    - repositoryDesignPaths
    - designReviewReport
    - humanDesignApproval
    - changedFiles
    - testResult
    - uiQaResult
    - pullRequestPlan
    - riskAndRollback
