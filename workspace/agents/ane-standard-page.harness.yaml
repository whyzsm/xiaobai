kind: Harness
version: 1
metadata:
  id: ane-standard-page-harness
tools:
  allow:
    - read_file
    - write_file
    - search_code
    - git_diff
    - run_tests
    - browser_check
    - screenshot
    - create_branch
    - prepare_pull_request
  deny:
    - direct_merge
    - release
    - write_unmounted_repository
    - write_business_artifacts_to_engineering_repo
    - delete_repository
    - modify_budget_policy
context:
  loaders:
    - repository-skill
    - project-skill
    - requirement-brief
    - dynamic-mounted-repositories
    - project-context
    - context-evidence-selection
    - project-page-contract
    - project-import-rule
    - previous-memory
  # The selected project-context evidence includes schemas, validators, templates,
  # IMA retrieval results, and reference pages; the runtime reserves 25% headroom
  # for task context.
  maxCharacters: 160000
completion:
  type: staged-objective
  conditions:
    - requirement_source_traceable
    - target_repository_ready
    - project_context_resolved
    - project_context_locked
    - context_evidence_selected
    - page_contract_generated
    - page_contract_schema_passed
    - page_contract_digest_locked
    - generator_consumed_context_evidence
    - import_rule_verified
    - page_structure_verified
    - evaluator_reused_same_contract
    - stage_timing_recorded
failure:
  onRequirementIncomplete: persist-to-inbox
  onContextMissing: stop-before-implementation
  onContractFailure: stop-before-implementation
  onHumanApprovalMissing: stop-before-implementation
  onToolError: retry-once
  onTestFailure: return-to-loop
  onBudgetExceeded: stop-and-persist
  errorCodes:
    - PROJECT_CONTEXT_REQUIRED
    - PROJECT_CONTEXT_DIGEST_MISMATCH
    - PAGE_CONTRACT_REQUIRED
    - PAGE_CONTRACT_SCHEMA_FAILED
    - PAGE_CONTRACT_DIGEST_MISMATCH
    - PROJECT_CONTEXT_RULE_NOT_CONSUMED
    - IMPORT_RULE_SOURCE_INVALID
    - MOCK_AUTH_SOURCE_FORBIDDEN
    - PAGE_STRUCTURE_NOT_STANDARD
output:
  required:
    - requirementBrief
    - targetRepository
    - projectContext
    - evidenceSelection
    - pageContractPath
    - contextDigest
    - contractDigest
    - generatorEvidence
    - importRuleResult
    - pageStructureResult
    - evaluationVerdict
    - stageTiming
    - deliverySummary
